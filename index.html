<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>시험 공부 매니저</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">시험 공부 매니저</div>
    <nav class="nav">
      <button data-nav="dashboard">오늘</button>
      <button data-nav="study">학습</button>
      <button data-nav="practice">모의 테스트</button>
      <button data-nav="decks">덱</button>
      <button data-nav="stats">통계</button>
      <button data-nav="settings">설정</button>
      <button data-nav="guide">사용법</button>
    </nav>
    <div class="pomo" id="pomo" title="뽀모도로 타이머">
      <span class="pomo-mode" id="pomo-mode">집중</span>
      <span class="pomo-time" id="pomo-time">25:00</span>
      <button data-action="pomo-toggle" id="pomo-toggle">시작</button>
      <button data-action="pomo-reset" class="ghost" title="타이머 초기화">↺</button>
      <button data-action="pomo-skip" class="ghost" title="다음 단계로 건너뛰기">⏭</button>
    </div>
  </header>

  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
